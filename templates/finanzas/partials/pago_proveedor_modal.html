<div class="p-6 bg-white rounded-3xl" x-data="{
  proveedorId: '',
  proveedorNombre: '',
  saldoDeuda: 0
}">
  <div class="flex items-center justify-between pb-4 border-b border-slate-100">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-700 flex items-center justify-center font-bold text-lg">
        💸
      </div>
      <div>
        <h3 class="text-base font-extrabold text-slate-900 tracking-tight">Emitir Orden de Pago a Proveedor</h3>
        <p class="text-xs text-slate-500">Cancela deudas con contratistas, fletes o insumos desde tus cajas/bancos.</p>
      </div>
    </div>
    <button @click="modalPagoProveedor = false" type="button" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
  </div>

  <form method="post" action="{% url 'finanzas:proveedor_pagar' %}" class="mt-5 space-y-4">
    {% csrf_token %}

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Proveedor / Contratista Destino</label>
      <select 
        id="pago-proveedor-select"
        name="proveedor_id" 
        required 
        x-model="proveedorId"
        class="w-full text-xs font-semibold rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5 focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-500"
      >
        <option value="">-- Seleccione Proveedor --</option>
        {% for p in proveedores %}
          <option value="{{ p.id }}">{{ p.razon_social }} (Deuda: ${{ p.saldo_actual|floatformat:2 }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Caja / Banco de Origen (Fondos)</label>
        <select 
          name="cuenta_id" 
          required 
          class="w-full text-xs font-semibold rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5 focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-500"
        >
          <option value="">-- Cuenta de Pago --</option>
          {% for cta in cuentas %}
            <option value="{{ cta.id }}">{{ cta.nombre }} (${{ cta.saldo_actual|floatformat:2 }} {{ cta.moneda }})</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Importe a Pagar ($ ARS)</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-xs font-mono font-bold text-slate-400">$</span>
          <input 
            type="number" 
            step="0.01" 
            min="0.01"
            name="importe" 
            required 
            placeholder="0.00" 
            class="w-full pl-7 pr-3 py-2.5 text-xs font-mono font-extrabold text-slate-900 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-500"
          >
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Fecha de Pago</label>
        <input 
          type="date" 
          name="fecha" 
          value="{% now 'Y-m-d' %}" 
          required 
          class="w-full text-xs font-mono rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">N° Comprobante / OP / Transf.</label>
        <input 
          type="text" 
          name="comprobante_nro" 
          placeholder="Ej. OP-2026-0045" 
          class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2 font-mono"
        >
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Concepto / Detalle</label>
      <input 
        type="text" 
        name="concepto" 
        placeholder="Ej. Cancelación Factura Insumos Fitosanitarios Cuadro 4" 
        required 
        class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
      >
    </div>

    <div class="p-3 bg-amber-50 rounded-2xl border border-amber-200 text-xs text-amber-800 flex items-start space-x-2">
      <span class="text-base leading-none">ℹ️</span>
      <p>El importe egresará automáticamente de la caja seleccionada y reducirá la deuda en la cuenta corriente del proveedor.</p>
    </div>

    <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
      <button 
        type="button" 
        @click="modalPagoProveedor = false" 
        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button 
        type="submit" 
        class="px-4 py-2 bg-rose-700 hover:bg-rose-800 text-white text-xs font-bold rounded-xl shadow-xs transition-colors cursor-pointer"
      >
        Confirmar Pago
      </button>
    </div>
  </form>
</div>
