<!-- MODAL: Editar Notas Gerenciales y Parámetros del Período -->
<div 
  x-show="modalEditarNotas" 
  @cerrar-modal="modalEditarNotas = false"
  x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
>
  <div 
    class="bg-white rounded-2xl shadow-xl border border-slate-200/80 w-full max-w-xl overflow-hidden max-h-[90vh] flex flex-col"
    @click.away="modalEditarNotas = false"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
  >
    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/70 flex items-center justify-between shrink-0">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-oliva-100 text-oliva-800 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        </div>
        <div>
          <h3 class="text-sm font-bold text-slate-900">Editar Notas y Parámetros del Período</h3>
          <p class="text-[11px] text-slate-500">{{ cuadro_activo.titulo }}</p>
        </div>
      </div>
      <button @click="$dispatch('cerrar-modal'); modalEditarNotas = false" class="text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <!-- Form -->
    <form 
      method="POST" 
      action="{% if cuadro_activo %}{% url 'finanzas:cuadro_resultado_notas' cuadro_activo.id %}{% endif %}" 
      class="p-6 space-y-4 text-xs overflow-y-auto flex-1"
    >
      {% csrf_token %}

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Estado de Dictamen del Informe</label>
        <select 
          name="estado" 
          class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors text-slate-800 text-xs font-semibold"
        >
          {% for val, lbl in estado_cuadro_choices %}
            <option value="{{ val }}" {% if val == cuadro_activo.estado %}selected{% endif %}>{{ lbl }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Aceituna Cosechada / Molida (Kg)</label>
          <input 
            type="number" 
            step="0.01" 
            name="volumen_aceituna_kg" 
            value="{{ cuadro_activo.volumen_aceituna_kg }}" 
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors font-mono text-slate-800 text-xs"
          />
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Aceite Virgen Extra Elaborado (Litros)</label>
          <input 
            type="number" 
            step="0.01" 
            name="volumen_aceite_litros" 
            value="{{ cuadro_activo.volumen_aceite_litros }}" 
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors font-mono text-slate-800 text-xs"
          />
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Conclusiones Analíticas y Notas para el Directorio</label>
        <textarea 
          name="notas_gerencia" 
          rows="6" 
          placeholder="Escriba aquí los aspectos destacados del ejercicio, rendimiento en fábrica, precios de exportación logrados, etc." 
          class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors text-slate-800 text-xs leading-relaxed font-sans"
        >{{ cuadro_activo.notas_gerencia }}</textarea>
      </div>

      <!-- Footer -->
      <div class="pt-3 border-t border-slate-100 flex flex-col-reverse sm:flex-row sm:items-center sm:justify-end gap-2 sm:space-x-2 shrink-0">
        <button 
          type="button" 
          @click="$dispatch('cerrar-modal'); modalEditarNotas = false" 
          class="w-full sm:w-auto px-4 py-2.5 text-xs font-semibold text-slate-600 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors text-center cursor-pointer"
        >
          Cancelar
        </button>
        <button 
          type="submit" 
          class="w-full sm:w-auto px-4 py-2.5 text-xs font-bold text-white bg-oliva-700 hover:bg-oliva-800 rounded-xl shadow-xs transition-colors text-center"
        >
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
