<!-- Modal Pago o Cobro de Comprobante Fiscal -->
<div 
  x-show="modalPago" 
  @cerrar-modal="modalPago = false"
  x-cloak
  class="fixed inset-0 z-50 overflow-y-auto"
  role="dialog" 
  aria-modal="true"
>
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
    <div 
      x-show="modalPago"
      @click="modalPago = false"
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity"
    ></div>

    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

    <div 
      x-show="modalPago"
      class="inline-block align-bottom bg-white rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-slate-100"
    >
      <form method="post" action="{% url 'finanzas:comprobante_pago' %}">
        {% csrf_token %}
        <input type="hidden" name="comprobante_id" :value="comprobanteSeleccionado?.id">
        <input type="hidden" name="es_cobro" :value="comprobanteSeleccionado?.es_cobro ? '1' : '0'">

        <div class="px-6 py-5 bg-gradient-to-r from-emerald-900 to-emerald-800 text-white flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20">
              <svg class="w-5 h-5 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            </div>
            <div>
              <h3 class="text-base font-bold text-white">
                <span x-text="comprobanteSeleccionado?.es_cobro ? 'Registrar Cobro de Factura' : 'Emitir Pago de Factura'"></span>
              </h3>
              <p class="text-xs text-emerald-200">Afecta Cajas/Bancos, Cuenta Corriente y emite comprobante</p>
            </div>
          </div>
          <button type="button" @click="$dispatch('cerrar-modal'); modalPago = false" class="text-white/70 hover:text-white p-1 rounded-xl cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>

        <div class="p-6 space-y-4 text-xs">
          <!-- Detalle de la factura -->
          <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-1">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Factura:</span>
              <strong class="font-mono text-slate-900" x-text="comprobanteSeleccionado?.numero"></strong>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Entidad:</span>
              <span class="font-semibold text-slate-800 truncate max-w-[200px]" x-text="comprobanteSeleccionado?.razon"></span>
            </div>
            <div class="flex items-center justify-between border-t border-slate-200 pt-1.5 mt-1.5">
              <span class="text-[11px] font-bold text-slate-700">Saldo Pendiente:</span>
              <strong class="font-mono text-emerald-700 text-sm">$<span x-text="comprobanteSeleccionado?.saldo"></span></strong>
            </div>
          </div>

          <!-- Importe a Pagar / Cobrar -->
          <div>
            <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Importe a Cancelar (ARS) *</label>
            <input 
              type="number" 
              name="importe" 
              step="0.01" 
              required 
              :value="comprobanteSeleccionado?.saldo"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono font-bold text-base text-slate-900 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition-all"
            />
          </div>

          <!-- Cuenta Financiera (Caja o Banco) -->
          <div>
            <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">
              <span x-text="comprobanteSeleccionado?.es_cobro ? 'Cuenta Destino (Donde ingresa el dinero) *' : 'Cuenta Origen (De donde sale el dinero) *'"></span>
            </label>
            <select 
              name="cuenta_financiera_id" 
              required
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition-all"
            >
              {% for c in cuentas %}
                <option value="{{ c.id }}">{{ c.nombre }} ({{ c.moneda }} ${{ c.saldo_actual|floatformat:2 }})</option>
              {% endfor %}
            </select>
          </div>

          <!-- Medio de Pago -->
          <div>
            <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Medio de Pago *</label>
            <select 
              name="medio_pago" 
              required
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition-all"
            >
              <option value="TRANSFERENCIA">Transferencia Bancaria Inmediata</option>
              <option value="EFECTIVO">Efectivo en Finca / Caja Chica</option>
              <option value="CHEQUE_PROPIO">Cheque Propio Emitido (Diferido)</option>
              <option value="CHEQUE_TERCERO">Endoso Cheque de Tercero (Cartera)</option>
            </select>
          </div>

          <!-- Fecha -->
          <div>
            <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Fecha de la Operación *</label>
            <input 
              type="date" 
              name="fecha" 
              required 
              value="{{ fecha_hoy|date:'Y-m-d'|default:'2026-03-21' }}"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800"
            />
          </div>

          <!-- Beneficiario y Observaciones -->
          <div>
            <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Beneficiario / Aclaración</label>
            <input 
              type="text" 
              name="beneficiario_firmante" 
              placeholder="Ej. Martín Gómez (Chofer de reparto)"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800"
            />
          </div>
        </div>

        <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3">
          <button 
            type="button" 
            @click="$dispatch('cerrar-modal'); modalPago = false"
            class="px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer"
          >
            Cancelar
          </button>
          <button 
            type="submit" 
            class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold uppercase tracking-wider shadow-sm transition-all flex items-center gap-2"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Confirmar y Emitir Comprobante
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
