<!-- MODAL: Crear Nuevo Cuadro de Resultados -->
<div 
  x-show="modalNuevoCuadro" 
  x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
>
  <div 
    class="bg-white rounded-2xl shadow-xl border border-slate-200/80 w-full max-w-xl overflow-hidden max-h-[90vh] flex flex-col"
    @click.away="modalNuevoCuadro = false"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
  >
    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/70 flex items-center justify-between shrink-0">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-oliva-100 text-oliva-800 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </div>
        <div>
          <h3 class="text-sm font-bold text-slate-900">Nuevo Estado de Resultados</h3>
          <p class="text-[11px] text-slate-500">Defina el período, moneda y parámetros productivos para el informe.</p>
        </div>
      </div>
      <button @click="modalNuevoCuadro = false" class="text-slate-400 hover:text-slate-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <!-- Form -->
    <form method="POST" action="{% url 'finanzas:cuadro_resultado_create' %}" class="p-6 space-y-4 text-xs overflow-y-auto flex-1">
      {% csrf_token %}

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Título del Informe / Cuadro *</label>
        <input 
          type="text" 
          name="titulo" 
          required 
          placeholder="ej: Campaña Olivícola 2026 - Cierre Provisorio" 
          class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors font-medium text-slate-800 text-xs"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Tipo de Período *</label>
          <select 
            name="tipo_periodo" 
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors text-slate-800 text-xs"
          >
            {% for val, lbl in tipo_periodo_choices %}
              <option value="{{ val }}" {% if val == 'CAMPANA_ANUAL' %}selected{% endif %}>{{ lbl }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Moneda de Presentación *</label>
          <select 
            name="moneda" 
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors text-slate-800 text-xs"
          >
            {% for val, lbl in moneda_choices %}
              <option value="{{ val }}" {% if val == 'USD' %}selected{% endif %}>{{ lbl }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Fecha Desde *</label>
          <input 
            type="date" 
            name="fecha_inicio" 
            required 
            value="{% now 'Y-01-01' %}"
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors text-slate-800 text-xs font-mono"
          />
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Fecha Hasta *</label>
          <input 
            type="date" 
            name="fecha_fin" 
            required 
            value="{% now 'Y-12-31' %}"
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors text-slate-800 text-xs font-mono"
          />
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Tipo de Cambio (ARS/USD)</label>
          <input 
            type="number" 
            step="0.01" 
            name="tipo_cambio" 
            value="1050.00"
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors text-slate-800 text-xs font-mono"
          />
        </div>
      </div>

      <!-- Parámetros olivícolas -->
      <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
        <span class="block text-[11px] font-bold text-slate-600 uppercase tracking-wide">Parámetros Productivos de Campaña</span>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-600 mb-0.5">Aceituna Cosechada / Molida (Kg)</label>
            <input 
              type="number" 
              step="0.01" 
              name="volumen_aceituna_kg" 
              placeholder="ej: 1200000" 
              class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-slate-800 text-xs font-mono"
            />
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-0.5">Aceite Elaborado (Litros)</label>
            <input 
              type="number" 
              step="0.01" 
              name="volumen_aceite_litros" 
              placeholder="ej: 216000" 
              class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-slate-800 text-xs font-mono"
            />
          </div>
        </div>
      </div>

      <!-- Clonar de base existente -->
      {% if cuadros_resultado.exists %}
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Inicializar con datos de un período previo (Opcional)</label>
          <select 
            name="clonar_de" 
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-oliva-500 focus:ring-1 focus:ring-oliva-500 transition-colors text-slate-800 text-xs"
          >
            <option value="">Empezar con líneas en $ 0.00</option>
            {% for c in cuadros_resultado %}
              <option value="{{ c.id }}">Copiar importes de: {{ c.titulo }} ({{ c.fecha_fin|date:"Y" }})</option>
            {% endfor %}
          </select>
        </div>
      {% endif %}

      <!-- Footer -->
      <div class="pt-3 border-t border-slate-100 flex flex-col-reverse sm:flex-row sm:items-center sm:justify-end gap-2 sm:space-x-2 shrink-0">
        <button 
          type="button" 
          @click="modalNuevoCuadro = false" 
          class="w-full sm:w-auto px-4 py-2.5 text-xs font-semibold text-slate-600 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors text-center"
        >
          Cancelar
        </button>
        <button 
          type="submit" 
          class="w-full sm:w-auto px-4 py-2.5 text-xs font-bold text-white bg-oliva-700 hover:bg-oliva-800 rounded-xl shadow-xs transition-colors text-center"
        >
          Generar Cuadro
        </button>
      </div>
    </form>
  </div>
</div>
