<!-- Modal: Transferencia entre Cuentas -->
<form method="post" action="{% url 'finanzas:transferencia_create' %}">
  {% csrf_token %}
  <div class="px-6 py-5 border-b border-slate-200/80 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-xl bg-blue-100 flex items-center justify-center">
        <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
        </svg>
      </div>
      <div>
        <h2 class="text-sm font-bold text-slate-900">Transferencia entre Cuentas</h2>
        <p class="text-[11px] text-slate-400">Movimiento interno de fondos</p>
      </div>
    </div>
    <button type="button" @click="modalTransferencia = false" class="text-slate-400 hover:text-slate-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div class="px-6 py-5 space-y-4">
    <!-- Origen → Destino visual -->
    <div class="grid grid-cols-5 gap-2 items-center">
      <div class="col-span-2">
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Cuenta Origen *</label>
        <select name="cuenta" required
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 bg-slate-50/50 transition">
          {% for c in cuentas %}
          <option value="{{ c.id }}">{{ c.nombre }} ({{ c.moneda }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-span-1 flex justify-center pt-5">
        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </div>
      <div class="col-span-2">
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Cuenta Destino *</label>
        <select name="cuenta_destino" required
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 bg-slate-50/50 transition">
          {% for c in cuentas %}
          <option value="{{ c.id }}">{{ c.nombre }} ({{ c.moneda }})</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Importe *</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-mono">$</span>
          <input type="number" name="importe" step="0.01" min="0.01" required
            placeholder="0.00"
            class="w-full pl-7 pr-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 bg-slate-50/50 transition font-mono"/>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Moneda</label>
        <select name="moneda"
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 bg-slate-50/50 transition">
          <option value="ARS" selected>ARS — Pesos</option>
          <option value="USD">USD — Dólares</option>
        </select>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Fecha *</label>
        <input type="date" name="fecha" required
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 bg-slate-50/50 transition"/>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Concepto *</label>
        <input type="text" name="concepto" required placeholder="Ej: Depósito finca → banco"
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 bg-slate-50/50 transition"/>
      </div>
    </div>

    <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 text-[11px] text-blue-700">
      <strong>Nota:</strong> La transferencia descuenta el importe de la cuenta origen y lo acredita en la cuenta destino de forma atómica.
    </div>
  </div>

  <div class="px-6 py-4 border-t border-slate-200/80 flex items-center justify-end space-x-3 bg-slate-50/50">
    <button type="button" @click="modalTransferencia = false"
      class="px-4 py-2 text-xs font-semibold text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition">
      Cancelar
    </button>
    <button type="submit"
      class="px-5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm transition">
      Confirmar Transferencia
    </button>
  </div>
</form>
