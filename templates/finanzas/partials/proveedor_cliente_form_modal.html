<div class="p-6 bg-white rounded-3xl" x-data="{
  tipo: '{{ tipo_default|default:'PROVEEDOR' }}',
  cuit: '',
  razonSocial: '',
  direccion: '',
  consultandoArca: false,
  mensajeArca: '',
  errorArca: '',
  async consultarArca() {
    let clean = (this.cuit || '').replace(/\D/g, '');
    if (clean.length < 8) {
      this.errorArca = 'Ingresá un CUIT o DNI válido de 11 u 8 dígitos';
      this.mensajeArca = '';
      return;
    }
    this.consultandoArca = true;
    this.errorArca = '';
    this.mensajeArca = '';
    try {
      let res = await fetch('/finanzas/api/afip/padron/' + clean + '/');
      let data = await res.json();
      if (data.success && data.data) {
        if (data.data.razon_social) this.razonSocial = data.data.razon_social;
        if (data.data.domicilio) this.direccion = data.data.domicilio;
        this.mensajeArca = '✅ Datos recuperados de ARCA: ' + (data.data.condicion_iva_display || 'Válido');
      } else {
        this.errorArca = data.error || 'No se encontraron datos en ARCA';
      }
    } catch (e) {
      this.errorArca = 'Error de conexión con el servicio ARCA';
    } finally {
      this.consultandoArca = false;
    }
  }
}">
  <div class="flex items-center justify-between pb-4 border-b border-slate-100">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-oliva-50 text-oliva-800 flex items-center justify-center font-bold text-lg">
        👥
      </div>
      <div>
        <h3 class="text-base font-extrabold text-slate-900 tracking-tight" x-text="tipo === 'PROVEEDOR' ? 'Nuevo Proveedor' : 'Nuevo Cliente'"></h3>
        <p class="text-xs text-slate-500">Da de alta una cuenta corriente comercial en el sistema.</p>
      </div>
    </div>
    <button @click="modalNuevoEntidad = false" type="button" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
  </div>

  <form method="post" action="{% url 'finanzas:cuenta_corriente_crear' %}" class="mt-5 space-y-4">
    {% csrf_token %}

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Tipo de Entidad</label>
        <select 
          name="tipo_entidad" 
          x-model="tipo"
          class="w-full text-xs font-semibold rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5"
        >
          <option value="PROVEEDOR">Proveedor (Insumos, Contratistas, Fletes)</option>
          <option value="CLIENTE">Cliente (Aceiteras, Distribuidores, Exportación)</option>
        </select>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-bold text-slate-700">CUIT / DNI Fiscal *</label>
          <button 
            type="button" 
            @click="consultarArca()"
            :disabled="consultandoArca"
            class="text-[10px] font-bold text-oliva-700 hover:text-oliva-900 disabled:opacity-50 cursor-pointer transition-colors"
          >
            <span x-show="!consultandoArca">🔍 Consultar ARCA</span>
            <span x-show="consultandoArca" class="flex items-center gap-1">
              <svg class="animate-spin w-2.5 h-2.5 text-oliva-700" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
              Buscando...
            </span>
          </button>
        </div>
        <div class="flex gap-1.5">
          <input 
            type="text" 
            name="cuit" 
            x-model="cuit"
            required 
            placeholder="30-12345678-9" 
            class="w-full text-xs font-mono rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
          >
          <button 
            type="button" 
            @click="consultarArca()"
            :disabled="consultandoArca"
            class="px-2.5 py-1.5 bg-oliva-700 hover:bg-oliva-800 text-white rounded-xl text-[11px] font-bold transition-colors cursor-pointer shrink-0 disabled:opacity-50 shadow-xs"
            title="Consultar Padrón de ARCA / AFIP"
          >
            ARCA
          </button>
        </div>
        <p x-show="mensajeArca" x-text="mensajeArca" class="text-[10px] text-emerald-700 font-semibold mt-1"></p>
        <p x-show="errorArca" x-text="errorArca" class="text-[10px] text-rose-600 font-semibold mt-1"></p>
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Razón Social *</label>
      <input 
        type="text" 
        name="razon_social" 
        x-model="razonSocial"
        required 
        placeholder="Ej. Distribuidora Cuyo S.A. / Aceites y Frutos S.R.L." 
        class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2 font-semibold"
      >
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nombre Comercial (Opcional)</label>
        <input 
          type="text" 
          name="nombre_comercial" 
          placeholder="Nombre de fantasía o marca" 
          class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Límite de Crédito ($ ARS)</label>
        <input 
          type="number" 
          step="0.01" 
          name="limite_credito" 
          value="0.00" 
          class="w-full text-xs font-mono rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2 text-right"
        >
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Teléfono</label>
        <input 
          type="text" 
          name="telefono" 
          placeholder="+54 9 380 412-3456" 
          class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico</label>
        <input 
          type="email" 
          name="email" 
          placeholder="administracion@empresa.com" 
          class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
        >
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Dirección Comercial</label>
      <input 
        type="text" 
        name="direccion" 
        x-model="direccion"
        placeholder="Ruta Provincial 9 Km 45, Aimogasta, La Rioja" 
        class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
      >
    </div>

    <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
      <button 
        type="button" 
        @click="modalNuevoEntidad = false" 
        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button 
        type="submit" 
        class="px-4 py-2 bg-oliva-700 hover:bg-oliva-800 text-white text-xs font-bold rounded-xl shadow-xs transition-colors cursor-pointer"
      >
        Guardar Cuenta Corriente
      </button>
    </div>
  </form>
</div>
