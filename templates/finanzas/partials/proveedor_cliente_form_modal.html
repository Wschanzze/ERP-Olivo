<div class="p-6 bg-white rounded-3xl" x-data="{
  tipo: '{{ tipo_default|default:'PROVEEDOR' }}'
}">
  <div class="flex items-center justify-between pb-4 border-b border-slate-100">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-oliva-50 text-oliva-800 flex items-center justify-center font-bold text-lg">
        👥
      </div>
      <div>
        <h3 class="text-base font-extrabold text-slate-900 tracking-tight" x-text="tipo === 'PROVEEDOR' ? 'Nuevo Proveedor' : 'Nuevo Cliente'"></h3>
        <p class="text-xs text-slate-500">Da de alta una cuenta corriente comercial en el sistema.</p>
      </div>
    </div>
    <button @click="modalNuevoEntidad = false" type="button" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
  </div>

  <form method="post" action="{% url 'finanzas:cuenta_corriente_crear' %}" class="mt-5 space-y-4">
    {% csrf_token %}

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Tipo de Entidad</label>
        <select 
          name="tipo_entidad" 
          x-model="tipo"
          class="w-full text-xs font-semibold rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5"
        >
          <option value="PROVEEDOR">Proveedor (Insumos, Contratistas, Fletes)</option>
          <option value="CLIENTE">Cliente (Aceiteras, Distribuidores, Exportación)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">CUIT / Identificación Fiscal</label>
        <input 
          type="text" 
          name="cuit" 
          required 
          placeholder="30-12345678-9" 
          class="w-full text-xs font-mono rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
        >
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Razón Social</label>
      <input 
        type="text" 
        name="razon_social" 
        required 
        placeholder="Ej. Distribuidora Cuyo S.A. / Aceites y Frutos S.R.L." 
        class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2 font-semibold"
      >
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nombre Comercial (Opcional)</label>
        <input 
          type="text" 
          name="nombre_comercial" 
          placeholder="Nombre de fantasía o marca" 
          class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Límite de Crédito ($ ARS)</label>
        <input 
          type="number" 
          step="0.01" 
          name="limite_credito" 
          value="0.00" 
          class="w-full text-xs font-mono rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2 text-right"
        >
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Teléfono</label>
        <input 
          type="text" 
          name="telefono" 
          placeholder="+54 9 380 412-3456" 
          class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico</label>
        <input 
          type="email" 
          name="email" 
          placeholder="administracion@empresa.com" 
          class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
        >
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Dirección Comercial</label>
      <input 
        type="text" 
        name="direccion" 
        placeholder="Ruta Provincial 9 Km 45, Aimogasta, La Rioja" 
        class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
      >
    </div>

    <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
      <button 
        type="button" 
        @click="modalNuevoEntidad = false" 
        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button 
        type="submit" 
        class="px-4 py-2 bg-oliva-700 hover:bg-oliva-800 text-white text-xs font-bold rounded-xl shadow-xs transition-colors cursor-pointer"
      >
        Guardar Cuenta Corriente
      </button>
    </div>
  </form>
</div>
