<div class="p-6 bg-white rounded-3xl" x-data="{
  accion: 'depositar',
  chequeId: null,
  chequeNumero: '',
  chequeImporte: 0,
  chequeBanco: ''
}">
  <div class="flex items-center justify-between pb-4 border-b border-slate-100">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-800 flex items-center justify-center font-bold text-lg">
        ⚡
      </div>
      <div>
        <h3 class="text-base font-extrabold text-slate-900 tracking-tight" x-text="'Gestión de Cheque #' + chequeNumero"></h3>
        <p class="text-xs text-slate-500" x-text="chequeBanco + ' • $' + Number(chequeImporte).toLocaleString('es-AR', {minimumFractionDigits: 2})"></p>
      </div>
    </div>
    <button @click="modalAccionCheque = false" type="button" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
  </div>

  <form :action="'/finanzas/cheques/' + chequeId + '/cambiar-estado/'" method="post" class="mt-5 space-y-4">
    {% csrf_token %}

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Acción a Realizar</label>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <button 
          type="button" 
          @click="accion = 'depositar'" 
          :class="accion === 'depositar' ? 'bg-oliva-700 text-white font-bold border-oliva-700' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'"
          class="p-2.5 rounded-xl border text-xs text-center transition-colors cursor-pointer"
        >
          🏦 Depositar
        </button>
        <button 
          type="button" 
          @click="accion = 'acreditar'" 
          :class="accion === 'acreditar' ? 'bg-emerald-600 text-white font-bold border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'"
          class="p-2.5 rounded-xl border text-xs text-center transition-colors cursor-pointer"
        >
          ✅ Acreditar
        </button>
        <button 
          type="button" 
          @click="accion = 'endosar'" 
          :class="accion === 'endosar' ? 'bg-amber-600 text-white font-bold border-amber-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'"
          class="p-2.5 rounded-xl border text-xs text-center transition-colors cursor-pointer"
        >
          🤝 Endosar
        </button>
        <button 
          type="button" 
          @click="accion = 'rechazar'" 
          :class="accion === 'rechazar' ? 'bg-rose-600 text-white font-bold border-rose-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'"
          class="p-2.5 rounded-xl border text-xs text-center transition-colors cursor-pointer"
        >
          ❌ Rechazar
        </button>
      </div>
      <input type="hidden" name="accion" :value="accion">
    </div>

    <!-- Campos según la acción elegida -->
    <template x-if="accion === 'depositar' || accion === 'acreditar'">
      <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
        <label class="block text-xs font-bold text-slate-700">Cuenta Bancaria Receptora</label>
        <select name="cuenta_bancaria_id" class="w-full text-xs font-semibold rounded-xl border-slate-200 bg-white px-3 py-2">
          {% for cta in cuentas %}
            {% if cta.tipo == 'BANCO' or not cta.tipo %}
              <option value="{{ cta.id }}">{{ cta.nombre }} ({{ cta.banco_nombre|default:'Banco' }} - ${{ cta.saldo_actual|floatformat:2 }})</option>
            {% endif %}
          {% endfor %}
        </select>
        <p class="text-[11px] text-slate-500">
          <span x-show="accion === 'depositar'">El cheque pasará a estado DEPOSITADO esperando acreditación bancaria.</span>
          <span x-show="accion === 'acreditar'">El importe se acreditará inmediatamente como INGRESO en la cuenta bancaria.</span>
        </p>
      </div>
    </template>

    <template x-if="accion === 'endosar'">
      <div class="p-3.5 bg-amber-50 rounded-2xl border border-amber-200 space-y-2">
        <label class="block text-xs font-bold text-amber-900">Proveedor Destinatario del Endoso</label>
        <select name="proveedor_id" class="w-full text-xs font-semibold rounded-xl border-amber-200 bg-white px-3 py-2">
          {% for prov in proveedores %}
            <option value="{{ prov.id }}">{{ prov.razon_social }} (Deuda: ${{ prov.saldo_actual|floatformat:2 }})</option>
          {% endfor %}
        </select>
        <p class="text-[11px] text-amber-800">
          El cheque se entregará al proveedor, reduciendo la deuda con el contratista/proveedor seleccionado.
        </p>
      </div>
    </template>

    <template x-if="accion === 'rechazar'">
      <div class="p-3.5 bg-rose-50 rounded-2xl border border-rose-200 space-y-2">
        <label class="block text-xs font-bold text-rose-900">Motivo del Rechazo Bancario</label>
        <input 
          type="text" 
          name="motivo" 
          placeholder="Ej. Sin fondos suficientes / Defecto formal de firma" 
          class="w-full text-xs rounded-xl border-rose-200 bg-white px-3 py-2"
        >
        <p class="text-[11px] text-rose-700">El cheque quedará marcado como RECHAZADO y requerirá gestión de cobro.</p>
      </div>
    </template>

    <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
      <button 
        type="button" 
        @click="modalAccionCheque = false" 
        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button 
        type="submit" 
        class="px-4 py-2 bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold rounded-xl shadow-xs transition-colors cursor-pointer"
      >
        Aplicar Acción
      </button>
    </div>
  </form>
</div>
