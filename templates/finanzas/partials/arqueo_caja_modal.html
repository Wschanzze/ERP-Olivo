<div class="p-6 bg-white rounded-3xl" x-data="{
  cuentaSeleccionadaId: '',
  saldoSistema: 0,
  montoFisico: 0,
  get diferencia() {
    return (parseFloat(this.montoFisico) || 0) - (parseFloat(this.saldoSistema) || 0);
  },
  actualizarSaldo() {
    const el = document.getElementById('arqueo-cuenta-select');
    if (el && el.selectedOptions.length > 0) {
      this.saldoSistema = parseFloat(el.selectedOptions[0].getAttribute('data-saldo') || '0');
    }
  }
}">
  <div class="flex items-center justify-between pb-4 border-b border-slate-100">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-700 flex items-center justify-center font-bold text-lg">
        ⚖️
      </div>
      <div>
        <h3 class="text-base font-extrabold text-slate-900 tracking-tight">Arqueo de Caja &amp; Control Físico</h3>
        <p class="text-xs text-slate-500">Compara el dinero físico contado contra el saldo registrado en el sistema.</p>
      </div>
    </div>
    <button @click="$dispatch('cerrar-modal'); modalArqueo = false" type="button" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
  </div>

  <form method="post" action="{% url 'finanzas:caja_arqueo' %}" class="mt-5 space-y-4">
    {% csrf_token %}

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Cuenta / Caja a Arquear</label>
      <select 
        id="arqueo-cuenta-select"
        name="cuenta_id" 
        required 
        x-model="cuentaSeleccionadaId" 
        @change="actualizarSaldo()"
        class="w-full text-xs font-semibold rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5 focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-500"
      >
        <option value="">-- Seleccione Caja o Cuenta Bancaria --</option>
        {% for cta in cuentas %}
          <option value="{{ cta.id }}" data-saldo="{{ cta.saldo_actual }}">{{ cta.nombre }} ({{ cta.moneda }} - Saldo: ${{ cta.saldo_actual|floatformat:2 }})</option>
        {% endfor %}
      </select>
    </div>

    <!-- Comparativa en Vivo -->
    <div class="grid grid-cols-2 gap-3 p-4 bg-slate-50 rounded-2xl border border-slate-100">
      <div>
        <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Saldo en Sistema</span>
        <span class="text-lg font-extrabold font-mono text-slate-800 tabular-nums" x-text="'$' + Number(saldoSistema).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})"></span>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Efectivo Físico Contado</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-xs font-mono font-bold text-slate-400">$</span>
          <input 
            type="number" 
            step="0.01" 
            name="monto_fisico" 
            x-model="montoFisico" 
            required 
            placeholder="0.00" 
            class="w-full pl-7 pr-3 py-1.5 text-sm font-mono font-extrabold text-slate-900 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-500"
          >
        </div>
      </div>
    </div>

    <!-- Indicador de Diferencia -->
    <div 
      class="p-3.5 rounded-2xl border transition-colors flex items-center justify-between"
      :class="{
        'bg-emerald-50 border-emerald-200 text-emerald-900': diferencia === 0,
        'bg-amber-50 border-amber-200 text-amber-900': diferencia > 0,
        'bg-rose-50 border-rose-200 text-rose-900': diferencia < 0
      }"
    >
      <div class="flex items-center space-x-2">
        <span class="text-base" x-text="diferencia === 0 ? '✅' : (diferencia > 0 ? '📈' : '📉')"></span>
        <div>
          <span class="text-xs font-bold block" x-text="diferencia === 0 ? 'Caja Cuadrada (Exacta)' : (diferencia > 0 ? 'Sobrante de Caja' : 'Faltante de Caja')"></span>
          <span class="text-[11px] opacity-80" x-text="diferencia === 0 ? 'El físico coincide 100% con el sistema.' : 'Existe una discrepancia de conteo.'"></span>
        </div>
      </div>
      <div class="text-right font-mono font-black text-sm tabular-nums" x-text="(diferencia >= 0 ? '+$' : '-$') + Math.abs(diferencia).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})"></div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Observaciones / Responsable</label>
      <input 
        type="text" 
        name="observaciones" 
        placeholder="Ej. Cierre de turno tarde - Arqueado por tesorería central" 
        class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2"
      >
    </div>

    <div class="flex items-center justify-between pt-1">
      <label class="flex items-center space-x-2 text-xs font-semibold text-slate-700 cursor-pointer">
        <input type="checkbox" name="ajustar_saldo" value="true" class="rounded border-slate-300 text-oliva-700 focus:ring-oliva-500 h-4 w-4">
        <span>Ajustar automáticamente el saldo en sistema</span>
      </label>
    </div>

    <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
      <button 
        type="button" 
        @click="$dispatch('cerrar-modal'); modalArqueo = false" 
        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button 
        type="submit" 
        class="px-4 py-2 bg-oliva-700 hover:bg-oliva-800 text-white text-xs font-bold rounded-xl shadow-xs transition-colors cursor-pointer"
      >
        Registrar Arqueo
      </button>
    </div>
  </form>
</div>
