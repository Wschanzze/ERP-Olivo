<!-- Modal Carga de Comprobante Fiscal (Factura A, B, C) -->
<div 
  x-show="modalComprobante" 
  x-cloak
  class="fixed inset-0 z-50 overflow-y-auto"
  role="dialog" 
  aria-modal="true"
  x-data="{
    neto21: 0,
    neto105: 0,
    exento: 0,
    percepIIBB: 0,
    iva21() { return Math.round((parseFloat(this.neto21) || 0) * 0.21 * 100) / 100; },
    iva105() { return Math.round((parseFloat(this.neto105) || 0) * 0.105 * 100) / 100; },
    total() {
      return (
        (parseFloat(this.neto21) || 0) +
        (parseFloat(this.neto105) || 0) +
        this.iva21() +
        this.iva105() +
        (parseFloat(this.exento) || 0) +
        (parseFloat(this.percepIIBB) || 0)
      ).toFixed(2);
    }
  }"
>
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
    <div 
      x-show="modalComprobante"
      @click="modalComprobante = false"
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity"
    ></div>

    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

    <div 
      x-show="modalComprobante"
      class="inline-block align-bottom bg-white rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full border border-slate-100"
    >
      <form method="post" action="{% url 'finanzas:comprobante_create' %}">
        {% csrf_token %}
        <div class="px-6 py-5 bg-gradient-to-r from-oliva-900 to-oliva-800 text-white flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20">
              <svg class="w-5 h-5 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div>
              <h3 class="text-base font-bold text-white">Nuevo Comprobante Fiscal (Libro IVA)</h3>
              <p class="text-xs text-oliva-200">Facturas de compra (crédito fiscal) o ventas (débito fiscal)</p>
            </div>
          </div>
          <button type="button" @click="modalComprobante = false" class="text-white/70 hover:text-white p-1 rounded-xl">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>

        <div class="p-6 space-y-4 max-h-[75vh] overflow-y-auto text-xs">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Tipo de Operación -->
            <div>
              <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Tipo de Operación *</label>
              <select 
                name="tipo_operacion" 
                x-model="tipoComprobanteOperacion"
                required
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-600 transition-all"
              >
                <option value="COMPRA">Factura de Compra (Proveedor - Crédito Fiscal)</option>
                <option value="VENTA">Factura de Venta (Cliente - Débito Fiscal)</option>
              </select>
            </div>

            <!-- Tipo de Comprobante -->
            <div>
              <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Comprobante *</label>
              <select 
                name="tipo_comprobante" 
                required
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-600 transition-all"
              >
                <option value="F_A">Factura A (Discrimina IVA)</option>
                <option value="F_B">Factura B (IVA Incluido)</option>
                <option value="F_C">Factura C (Monotributo / Exento)</option>
                <option value="F_M">Factura M (Régimen Retención)</option>
                <option value="ND_A">Nota de Débito A</option>
                <option value="NC_A">Nota de Crédito A</option>
                <option value="REC_OF">Recibo Oficial</option>
              </select>
            </div>
          </div>

          <!-- Punto de Venta y Número -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Punto de Venta (5 dígitos) *</label>
              <input 
                type="text" 
                name="punto_de_venta" 
                required 
                maxlength="5"
                value="00001"
                placeholder="00001"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono font-bold text-slate-900 focus:bg-white focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-600 transition-all"
              />
            </div>
            <div>
              <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Número de Factura (8 dígitos) *</label>
              <input 
                type="text" 
                name="numero_comprobante" 
                required 
                maxlength="8"
                placeholder="00012345"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono font-bold text-slate-900 focus:bg-white focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-600 transition-all"
              />
            </div>
          </div>

          <!-- Fechas -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Fecha de Emisión *</label>
              <input 
                type="date" 
                name="fecha_emision" 
                required 
                value="{{ fecha_hoy|date:'Y-m-d'|default:'2026-03-21' }}"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-600 transition-all"
              />
            </div>
            <div>
              <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Fecha de Vencimiento (Pago)</label>
              <input 
                type="date" 
                name="fecha_vencimiento" 
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-600 transition-all"
              />
            </div>
          </div>

          <!-- Proveedor o Cliente -->
          <div>
            <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">
              <span x-show="tipoComprobanteOperacion === 'COMPRA'">Proveedor Emisor *</span>
              <span x-show="tipoComprobanteOperacion === 'VENTA'">Cliente Receptor *</span>
            </label>
            <select 
              name="cuenta_corriente_id" 
              required
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-600 transition-all"
            >
              <option value="">(Seleccionar de la lista de cuentas corrientes)</option>
              <optgroup label="Proveedores de Insumos &amp; Servicios">
                {% for p in proveedores %}
                  <option value="{{ p.id }}">{{ p.razon_social }} (CUIT: {{ p.cuit }})</option>
                {% endfor %}
              </optgroup>
              <optgroup label="Clientes de Aceituna &amp; Aceite">
                {% for cl in clientes %}
                  <option value="{{ cl.id }}">{{ cl.razon_social }} (CUIT: {{ cl.cuit }})</option>
                {% endfor %}
              </optgroup>
            </select>
          </div>

          <!-- Concepto -->
          <div>
            <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Concepto / Detalle *</label>
            <input 
              type="text" 
              name="concepto" 
              required 
              placeholder="Ej. Fertilizantes solubles para fertirriego / Envases botellas 500ml"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-600 transition-all"
            />
          </div>

          <!-- Desglose Impositivo con Cálculo en Tiempo Real -->
          <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-3">
            <h4 class="font-bold text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
              <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
              Desglose Impositivo (Alícuotas AFIP)
            </h4>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Neto Gravado 21%</label>
                <input 
                  type="number" 
                  name="neto_gravado_21" 
                  step="0.01" 
                  x-model="neto21"
                  placeholder="0.00"
                  class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl font-mono text-slate-800"
                />
                <span class="text-[10px] text-oliva-700 font-bold block mt-0.5">IVA 21%: $<span x-text="iva21().toFixed(2)"></span></span>
              </div>

              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Neto Gravado 10.5% (Agro/Bienes)</label>
                <input 
                  type="number" 
                  name="neto_gravado_10_5" 
                  step="0.01" 
                  x-model="neto105"
                  placeholder="0.00"
                  class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl font-mono text-slate-800"
                />
                <span class="text-[10px] text-oliva-700 font-bold block mt-0.5">IVA 10.5%: $<span x-text="iva105().toFixed(2)"></span></span>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">No Gravado / Exento</label>
                <input 
                  type="number" 
                  name="exento" 
                  step="0.01" 
                  x-model="exento"
                  placeholder="0.00"
                  class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl font-mono text-slate-800"
                />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Percepciones IIBB (Catamarca / CM)</label>
                <input 
                  type="number" 
                  name="percepcion_iibb" 
                  step="0.01" 
                  x-model="percepIIBB"
                  placeholder="0.00"
                  class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl font-mono text-slate-800"
                />
              </div>
            </div>

            <!-- Total Calculado -->
            <div class="p-3 bg-white rounded-xl border border-slate-200 flex items-center justify-between">
              <span class="font-bold text-slate-700 uppercase">Total Factura:</span>
              <span class="font-mono font-black text-base text-slate-900">$<span x-text="total()"></span></span>
            </div>
          </div>

          <!-- Cuenta Contable Imputable -->
          <div>
            <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Imputación al Plan de Cuentas</label>
            <select 
              name="cuenta_contable_id"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-oliva-500/20 focus:border-oliva-600 transition-all"
            >
              <option value="">(Imputación por defecto según tipo)</option>
              {% for cc in cuentas_imputables %}
                <option value="{{ cc.id }}">{{ cc.codigo }} - {{ cc.nombre }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3">
          <button 
            type="button" 
            @click="modalComprobante = false"
            class="px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-slate-600 hover:bg-slate-100 transition-colors"
          >
            Cancelar
          </button>
          <button 
            type="submit" 
            class="px-5 py-2.5 rounded-xl bg-oliva-700 hover:bg-oliva-800 active:bg-oliva-900 text-white font-bold uppercase tracking-wider shadow-sm transition-all"
          >
            Registrar en Libro IVA &amp; Cta. Cte.
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
