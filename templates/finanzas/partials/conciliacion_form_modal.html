<!-- Modal: Iniciar Nueva Conciliación -->
<form method="post" action="{% url 'finanzas:conciliacion_create' %}">
  {% csrf_token %}
  <div class="px-6 py-5 border-b border-slate-200/80 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-xl bg-oliva-100 flex items-center justify-center">
        <svg class="w-4 h-4 text-oliva-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h2 class="text-sm font-bold text-slate-900">Nueva Conciliación Bancaria</h2>
        <p class="text-[11px] text-slate-400">Cotejar sistema vs extracto bancario</p>
      </div>
    </div>
    <button type="button" @click="modalConciliacion = false" class="text-slate-400 hover:text-slate-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div class="px-6 py-5 space-y-4">
    <div>
      <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Cuenta Bancaria *</label>
      <select name="cuenta" required
        class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition">
        {% for c in cuentas %}
        <option value="{{ c.id }}">{{ c.nombre }} — Saldo actual: ${{ c.saldo_actual|floatformat:2 }} {{ c.moneda }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Fecha de Corte del Extracto *</label>
        <input type="date" name="fecha_extracto" required
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition"/>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Saldo según Extracto *</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-mono">$</span>
          <input type="number" name="saldo_extracto" step="0.01" required placeholder="0.00"
            class="w-full pl-7 pr-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition font-mono"/>
        </div>
      </div>
    </div>

    <div>
      <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Observaciones</label>
      <textarea name="observaciones" rows="2" placeholder="Notas adicionales sobre esta conciliación..."
        class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition resize-none"></textarea>
    </div>

    <div class="bg-amber-50 border border-amber-100 rounded-xl p-3 text-[11px] text-amber-700">
      <strong>Siguiente paso:</strong> Después de crear la conciliación podrás marcar los movimientos del sistema que ya aparecen en el extracto bancario.
    </div>
  </div>

  <div class="px-6 py-4 border-t border-slate-200/80 flex items-center justify-end space-x-3 bg-slate-50/50">
    <button type="button" @click="modalConciliacion = false"
      class="px-4 py-2 text-xs font-semibold text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition">
      Cancelar
    </button>
    <button type="submit"
      class="px-5 py-2 text-xs font-bold text-white bg-oliva-700 hover:bg-oliva-800 rounded-xl shadow-sm transition">
      Iniciar Conciliación
    </button>
  </div>
</form>
