<!-- Modal: Nueva Cuenta Financiera -->
<form method="post" action="{% url 'finanzas:cuenta_create' %}">
  {% csrf_token %}
  <div class="px-6 py-5 border-b border-slate-200/80 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-xl bg-oliva-100 flex items-center justify-center">
        <svg class="w-4 h-4 text-oliva-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
        </svg>
      </div>
      <div>
        <h2 class="text-sm font-bold text-slate-900">Nueva Cuenta Financiera</h2>
        <p class="text-[11px] text-slate-400">Caja, banco o billetera virtual</p>
      </div>
    </div>
    <button type="button" @click="modalCuenta = false" class="text-slate-400 hover:text-slate-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div class="px-6 py-5 space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="col-span-1 sm:col-span-2">
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Nombre de la Cuenta *</label>
        <input type="text" name="nombre" required placeholder="Ej: Caja Finca San Isidro"
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition"/>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Tipo *</label>
        <select name="tipo" required
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition">
          <option value="CAJA_EFECTIVO">Caja Chica / Efectivo</option>
          <option value="BANCO" selected>Cuenta Bancaria</option>
          <option value="VIRTUAL">Billetera Virtual</option>
        </select>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Moneda *</label>
        <select name="moneda" required
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition">
          <option value="ARS" selected>ARS — Pesos Argentinos</option>
          <option value="USD">USD — Dólares</option>
        </select>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Banco (opcional)</label>
        <input type="text" name="banco_nombre" placeholder="Ej: Banco Nación"
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition"/>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">N° de Cuenta</label>
        <input type="text" name="numero_cuenta" placeholder="Ej: 010-000123456/7"
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition"/>
      </div>

      <div class="col-span-1 sm:col-span-2">
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">CBU / CVU / Alias</label>
        <input type="text" name="cbu_cvu" placeholder="Ej: 0070999520000001234567 o mi.alias"
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition"/>
      </div>

      <div class="col-span-1 sm:col-span-2">
        <label class="block text-[11px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Saldo Inicial</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-mono">$</span>
          <input type="number" name="saldo_actual" step="0.01" value="0" min="0"
            class="w-full pl-7 pr-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-oliva-500/30 focus:border-oliva-400 bg-slate-50/50 transition font-mono"/>
        </div>
      </div>

      <!-- empresa hidden — tomamos la primera (ajustar si hay multi-empresa) -->
      <input type="hidden" name="empresa" value="1"/>
    </div>
  </div>

  <div class="px-6 py-4 border-t border-slate-200/80 flex flex-col-reverse sm:flex-row sm:items-center sm:justify-end gap-2 sm:space-x-3 bg-slate-50/50">
    <button type="button" @click="modalCuenta = false"
      class="w-full sm:w-auto px-4 py-2.5 text-xs font-semibold text-slate-600 hover:text-slate-800 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition text-center">
      Cancelar
    </button>
    <button type="submit"
      class="w-full sm:w-auto px-5 py-2.5 text-xs font-bold text-white bg-oliva-700 hover:bg-oliva-800 rounded-xl shadow-sm transition text-center">
      Crear Cuenta
    </button>
  </div>
</form>
