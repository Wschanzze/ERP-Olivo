<!-- Modal: Editar Imputación de Costo -->
<div 
  x-show="modalEditarCosto" 
  x-cloak
  class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4"
  x-transition:enter="ease-out duration-300"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="ease-in duration-200"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
>
  <div 
    @click.away="modalEditarCosto = false" 
    class="bg-white rounded-3xl max-w-lg w-full shadow-2xl border border-slate-100 overflow-hidden"
  >
    <div class="px-6 py-5 bg-slate-900 text-white flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center font-bold text-base">
          ✏️
        </div>
        <div>
          <h3 class="text-sm font-extrabold tracking-tight">Editar Imputación #<span x-text="editCostoId"></span></h3>
          <p class="text-xs text-slate-400">Modifica la asignación agronómica, importe o cuenta contable.</p>
        </div>
      </div>
      <button @click="modalEditarCosto = false" type="button" class="p-1.5 text-slate-400 hover:text-white rounded-xl transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <form method="post" :action="'/costos/' + editCostoId + '/editar/'" class="p-6 space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Descripción / Concepto *</label>
        <input 
          type="text" 
          name="descripcion" 
          required 
          x-model="editCostoDesc"
          class="w-full text-xs rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5 focus:ring-2 focus:ring-[#3D4A2A]/20 focus:border-[#3D4A2A]"
        >
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Importe ($ ARS) *</label>
          <input 
            type="number" 
            name="importe_ars" 
            step="0.01" 
            min="0.01" 
            required 
            x-model="editCostoImporte"
            class="w-full text-xs font-bold font-mono rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5 focus:ring-2 focus:ring-[#3D4A2A]/20 focus:border-[#3D4A2A]"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Cuadro Destino</label>
          <select 
            name="cuadro_id" 
            x-model="editCostoCuadroId"
            class="w-full text-xs font-semibold rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5 focus:ring-2 focus:ring-[#3D4A2A]/20 focus:border-[#3D4A2A]"
          >
            <option value="general">[General / Sin Cuadro]</option>
            {% for cua in cuadros %}
              <option value="{{ cua.id }}">
                {{ cua.finca.nombre|slice:":4" }} - {{ cua.codigo }} ({{ cua.get_variedad_olivo_display|default:cua.nombre }})
              </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Cuenta Contable (Plan de Cuentas)</label>
        <select 
          name="cuenta_contable_id" 
          x-model="editCostoCuentaId"
          class="w-full text-xs font-semibold rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5 focus:ring-2 focus:ring-[#3D4A2A]/20 focus:border-[#3D4A2A]"
        >
          <option value="">-- Mantener por defecto --</option>
          {% for cta in cuentas_contables %}
            <option value="{{ cta.id }}">{{ cta.codigo }} - {{ cta.nombre }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Proveedor Vinculado (Opcional)</label>
        <select 
          name="proveedor_id" 
          x-model="editCostoProveedorId"
          class="w-full text-xs font-semibold rounded-xl border-slate-200 bg-slate-50 focus:bg-white px-3 py-2.5 focus:ring-2 focus:ring-[#3D4A2A]/20 focus:border-[#3D4A2A]"
        >
          <option value="">-- Sin Proveedor Asociado --</option>
          {% for p in proveedores %}
            <option value="{{ p.id }}">{{ p.razon_social }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-100">
        <button 
          @click="modalEditarCosto = false" 
          type="button" 
          class="px-4 py-2.5 text-xs font-bold text-slate-600 hover:text-slate-800 bg-slate-100 rounded-xl transition-colors cursor-pointer"
        >
          Cancelar
        </button>
        <button 
          type="submit" 
          class="px-5 py-2.5 text-xs font-bold text-white bg-slate-900 hover:bg-slate-800 rounded-xl shadow-md transition-colors cursor-pointer"
        >
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
