<div class="p-6">
    <div class="flex flex-col items-center justify-center text-center mb-5">
      <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mb-3">
        <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <h3 class="text-lg font-bold text-slate-800">Confirmar Eliminación</h3>
      <p class="text-sm text-slate-500 mt-2">¿Estás seguro de que deseas eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
    </div>
  
    <form hx-post="{{ request.path }}" hx-target="#modal-body" class="flex justify-center gap-3 pt-4 border-t border-slate-100">
      {% csrf_token %}
      <button type="button" @click="modalOpen = false" class="px-5 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer">
        Cancelar
      </button>
      <button type="submit" class="px-5 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl transition-colors shadow-sm cursor-pointer inline-flex items-center gap-2">
        Sí, Eliminar
      </button>
    </form>
</div>
