{% if parte.estado == 'CONFIRMADO_CERRADO' %}
  <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/70 shadow-2xs">
    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
    Confirmado & Cerrado
  </span>
{% else %}
  <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-200/70 shadow-2xs">
    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
    {{ parte.get_estado_display }}
  </span>
{% endif %}
