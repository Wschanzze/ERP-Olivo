<div class="p-6 space-y-4">
  <div class="flex items-center justify-between">
    <h3 class="text-base font-bold text-slate-900">Nuevo Registro Fenológico</h3>
    <button type="button" @click="modalOpen = false" class="text-slate-400 hover:text-slate-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <form hx-post="{% url 'campos:fenologia_create' %}" 
        hx-target="#cuadros-table-container" 
        hx-on::after-request="if(event.detail.successful) modalOpen = false"
        class="space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-2">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Cuadro</label>
        {{ form.cuadro }}
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Campaña</label>
        {{ form.campana }}
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha de observación</label>
        {{ form.fecha }}
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Fase Fenológica</label>
        {{ form.fase_vegetativa }}
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">GDC Acumulados</label>
        {{ form.grados_dia_acumulados }}
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Riesgo Fitosanitario</label>
        {{ form.riesgo_fitosanitario }}
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Temp. Mín (°C)</label>
        {{ form.temperatura_min }}
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Temp. Máx (°C)</label>
        {{ form.temperatura_max }}
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Observaciones</label>
        {{ form.observaciones }}
      </div>
    </div>
    <div class="flex justify-end gap-3 pt-2 border-t border-slate-100">
      <button type="button" @click="modalOpen = false" class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition-colors">Cancelar</button>
      <button type="submit" class="inline-flex items-center gap-2 bg-[#3D4A2A] text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-[#2A331D] transition-colors">Guardar Registro</button>
    </div>
  </form>
</div>
