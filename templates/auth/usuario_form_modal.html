<div class="space-y-5">
  <!-- Cabecera del Modal -->
  <div class="flex items-center justify-between pb-3 border-b border-slate-100">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-[#EAEFE3] text-[#3D4A2A] flex items-center justify-center">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
      </div>
      <div>
        <h3 class="text-base font-bold text-slate-900">Alta de Nuevo Usuario</h3>
        <p class="text-[11px] text-slate-500">Se registrará en Supabase Auth y se sincronizará en el ERP.</p>
      </div>
    </div>
    <button 
      type="button" 
      @click="modalOpen = false"
      class="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Contenedor para errores de validación HTMX -->
  <div id="modal-error-container"></div>

  <!-- Formulario -->
  <form 
    hx-post="{% url 'core:usuario_crear_modal' %}" 
    hx-target="#modal-error-container"
    hx-swap="innerHTML"
    class="space-y-4"
  >
    {% csrf_token %}

    <!-- Correo Electrónico -->
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">
        Correo Electrónico <span class="text-rose-500">*</span>
      </label>
      <input 
        type="email" 
        name="email" 
        required 
        placeholder="ejemplo@olivaresdelvalle.com.ar"
        class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-[#3D4A2A] focus:ring-1 focus:ring-[#3D4A2A] outline-none"
      />
    </div>

    <!-- Contraseña Inicial -->
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">
        Contraseña Inicial <span class="text-rose-500">*</span>
      </label>
      <input 
        type="text" 
        name="password" 
        required 
        minlength="6"
        placeholder="Mínimo 6 caracteres"
        class="w-full px-3 py-2 text-xs font-mono rounded-xl border border-slate-200 focus:border-[#3D4A2A] focus:ring-1 focus:ring-[#3D4A2A] outline-none"
      />
      <span class="text-[10px] text-slate-400 mt-0.5 block">El usuario podrá ingresar con esta contraseña inmediatamente.</span>
    </div>

    <!-- Nombre y Apellido -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre</label>
        <input 
          type="text" 
          name="first_name" 
          placeholder="Juan"
          class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-[#3D4A2A] focus:ring-1 focus:ring-[#3D4A2A] outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Apellido</label>
        <input 
          type="text" 
          name="last_name" 
          placeholder="Pérez"
          class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-[#3D4A2A] focus:ring-1 focus:ring-[#3D4A2A] outline-none"
        />
      </div>
    </div>

    <!-- Rol en el Sistema (RBAC) -->
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">
        Rol en el Sistema (Permisos) <span class="text-rose-500">*</span>
      </label>
      <select 
        name="rol" 
        required
        class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-slate-200 bg-white focus:border-[#3D4A2A] focus:ring-1 focus:ring-[#3D4A2A] outline-none cursor-pointer"
      >
        {% for val, label in roles %}
          <option value="{{ val }}" {% if val == 'OPERARIO' %}selected{% endif %}>
            {{ label }}
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Finca Predeterminada -->
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">
        Finca Asignada
      </label>
      <select 
        name="finca" 
        class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-slate-200 bg-white focus:border-[#3D4A2A] focus:ring-1 focus:ring-[#3D4A2A] outline-none cursor-pointer"
      >
        <option value="">-- Sin Finca Específica (Global) --</option>
        {% for f in fincas %}
          <option value="{{ f.id }}">{{ f.nombre }} ({{ f.codigo }})</option>
        {% endfor %}
      </select>
    </div>

    <!-- Botones de Acción -->
    <div class="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2">
      <button 
        type="button" 
        @click="modalOpen = false"
        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button 
        type="submit" 
        class="px-4 py-2 text-xs font-bold text-white bg-[#3D4A2A] hover:bg-[#2A331D] rounded-xl shadow-sm transition-all cursor-pointer"
      >
        Crear Usuario en Supabase & ERP
      </button>
    </div>

  </form>
</div>
